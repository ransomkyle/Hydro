name: Shipping QC

on:
  pull_request:
    paths: ['shipping-qc/**', '.github/workflows/shipping-qc.yml']
  push:
    branches: [main]
    paths: ['shipping-qc/**', '.github/workflows/shipping-qc.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shipping-qc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shipping-qc/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
